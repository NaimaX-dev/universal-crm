    <path d="M470 380 L400 700 L720 820 L1040 430"/>
    <path d="M1040 430 L1120 760 L1450 860 L1650 470"/>
    <path d="M400 700 L170 820"/>
    <path d="M720 820 L1120 760"/>
    <path d="M1330 300 L1450 860"/>
    <path d="M760 250 L720 820"/>
    <path d="M1650 470 L1790 740"/>
