    <circle cx="470" cy="380" r="34" fill="url(#node)"/>
    <circle cx="760" cy="250" r="26" fill="url(#node)"/>
    <circle cx="1040" cy="430" r="40" fill="url(#node)"/>
    <circle cx="1330" cy="300" r="28" fill="url(#node)"/>
