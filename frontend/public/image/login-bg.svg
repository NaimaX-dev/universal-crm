    <circle cx="180" cy="220" r="3"/><circle cx="470" cy="380" r="4"/><circle cx="760" cy="250" r="3"/>
    <circle cx="1040" cy="430" r="5"/><circle cx="1330" cy="300" r="3.5"/><circle cx="1650" cy="470" r="4.5"/>
